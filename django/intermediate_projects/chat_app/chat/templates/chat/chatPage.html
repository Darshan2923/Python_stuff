<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatApp</title>
</head>

<body>
    <center>
        <h1>Hello , Welcome to my chat site ! {{request.user}}</h1>
    </center>
    <br>
    {% if request.user.is_authenticated %}
    <center> Logout the chat Page <a href="{% url 'logout-user' %}">Logout</a></center>
    {% endif %}
    <div class="chat__item__container" id="id_chat_item_container" style="font-size: 20px">
        <br />
        <input type="text" id="id_message_send_input" />
        <button id="id_message_send_button" type="submit">Send Message</button>
        <br />
        <br />
    </div>
    <script>
        const chatSocket = new WebSocket("ws://" + window.location.host + "/");
        chatSocket.onopen = function (e) {
            console.log("Connection established");
        };
        chatSocket.onclose = function (e) {
            console.log("Connection closed");
        };
        document.querySelector('#id_message_send_input').focus();
        document.querySelector('#id_message_send_input').onkeyup = function (e) {
            if (e.keyCode === 13) {
                document.querySelector('#id_message_send_button').click();
            }
        };
        document.querySelector('#id_message_send_button').onclick = function (e) {
            let messageInput = document.querySelector('#id_message_send_input').value;
            chatSocket.send(JSON.stringify({
                'message': messageInput,
                username: "{{request.user.username}}"
            }));
            chatSocket.onmessage = function (e) {
                const data = JSON.parse(e.data);
                var div = document.createElement("div");
                div.innerHTML = data.username + " : " + data.message;
                document.querySelector("#id_message_send_input").value = "";
                document.querySelector("#id_chat_item_container").appendChild(div);
            }
        };
    </script>
</body>

</html>
